travessia:
  visivel: true
  rotulo: 01 · O começo
  tema: claro
  titulo: Antes de dar certo, deu bem errado.
  imagem: /assets/img/matheus-horacio.webp
  imagem_alt: Retrato de Matheus Horácio, Creative Lead do The Chosen Brasil
  imagem_legenda: Matheus Horácio, Creative Lead do The Chosen Brasil
  texto: >-
    **Matheus Horácio é comunicador e Creative Lead do The Chosen Brasil.**
    Trabalha com conteúdo digital há mais de dez anos. Esta é a ordem em que as
    coisas aconteceram.


    Em 2016 eu tinha um canal no YouTube com mais de **20 mil inscritos e
    milhões de visualizações**, legendando e dublando vídeo. Perdi tudo por
    direitos autorais. Vieram os strikes e o canal caiu. Demorei anos para
    entender que aquilo me libertou e me possibilitou iniciar outros projetos.


    Em 2020 eu conheci The Chosen. Vi uma série sobre um Jesus e personagens
    humanos que, naquele momento, ainda não era o normal. Hoje é. A série
    naturalizou isso.


    Em 2021 eu decidi uma coisa em voz alta: **eu vou ser o maior portal de The
    Chosen da América Latina.** Blog, YouTube, Instagram, Facebook e TikTok. Sem
    verba, sem equipe e sem a permissão de ninguém.


    Criei um ecossistema que entregava conteúdo de valor para os fãs da série.
    Teve momentos que o blog ultrapassou a marca de cem mil visualizações
    mensais. As redes sociais passaram de cem mil seguidores.
contratacao:
  visivel: true
  rotulo: 02 · A contratação
  tema: escuro
  titulo: Em 2022 a série me chamou.
  imagem: /assets/img/dallas-jenkins-diogenes-e-matheus-horacio.webp
  imagem_alt: Dallas Jenkins, Diógenes Cavalcante e Matheus Horácio na pré-estreia
    da Temporada 3 em São Paulo, Brasil.
  imagem_legenda: Dallas Jenkins, Diógenes Cavalcante e Matheus Horácio na
    pré-estreia da Temporada 3 em São Paulo, Brasil.
  texto: >-
    Quando o The Chosen conheceu o trabalho que eu já vinha construindo, me
    convidou para fazer parte do *primeiro time no Brasil*. Éramos apenas duas
    pessoas e começamos sem um manual pronto, sem calendário editorial e sem uma
    estrutura definida para as redes sociais.  
      
    Como organização e processos sempre fizeram parte da minha forma de
    trabalhar, assumi essa frente. *Criei o calendário editorial, organizei os
    fluxos e ajudei a construir a estrutura que orienta o conteúdo de The Chosen
    no Brasil até hoje.*  
      
    Naquela época, a série ainda não tinha nem uma fração do reconhecimento que
    tem hoje. Por isso, eu estava sempre atento a oportunidades que pudessem
    apresentá-la a mais pessoas.  
      
    Foi quando uma trend do Neymar começou a dominar o meu For You. Um filtro
    fazia parecer que a pessoa tinha tirado uma selfie com ele, e milhares de
    pessoas estavam usando.  
      
    Então pensei: *se funciona com um jogador de futebol, por que não
    funcionaria com Jesus?*  
      
    A partir dessa ideia, criei um filtro usando imagens do Jesus da série. O
    resultado foi *mais de 11 milhões de aberturas no Instagram e seis mil
    vídeos publicados no TikTok*, tudo isso sem um centavo de mídia paga.  
      
    Essa experiência me ensinou algo que levo comigo até hoje: *as pessoas não
    querem apenas receber a sua mensagem. Elas querem uma ferramenta para
    expressar a própria mensagem.*
queda:
  visivel: true
  rotulo: 03 · A queda e a volta
  tema: claro
  titulo: Fazer tudo funcionava. Até parar de funcionar.
  texto: >-
    Em 2024 eu tive um burnout e fiquei três meses afastado. Foi tudo ou nada, e
    eu não sabia se voltaria.


    **O burnout não foi o fracasso. O fracasso foi fazer tudo sozinho. O burnout
    foi a conta chegando.**


    Depois de muitos livros, reflexão e terapia, eu voltei. E, pasmem, voltei
    promovido. Aí veio a parte difícil: entregar o operacional que era meu.
    **Aprendi a delegar depois de quebrar por não delegar.**


    Hoje lidero várias pessoas e respondo pela criação do The Chosen Brasil. Os
    elogios que hoje recebo como gestor vieram depois de muita crítica. Eu errei
    bastante e aprendi.


    É por isso que, quando me chamam para falar sobre processo e delegação, eu
    não estou dando opinião. Estou mostrando cicatriz.
