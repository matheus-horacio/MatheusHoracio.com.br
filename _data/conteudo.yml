perguntas:
  visivel: true
  rotulo: 09 · Dúvidas frequentes
  tema: claro
  itens:
    - pergunta: Quem é Matheus Horácio?
      resposta: Matheus Horácio é comunicador e Creative Lead do The Chosen Brasil,
        residente em Londrina, no Paraná. Trabalha com conteúdo digital há mais
        de dez anos. Como fã, criou o maior portal brasileiro sobre a série The
        Chosen, passando de cem mil seguidores nas redes sociais e cem mil
        visualizações mensais no blog, e foi contratado pela própria série em
        outubro de 2022. Hoje lidera a criação do The Chosen Brasil e palestra
        sobre construção de audiência, comunidade e processo criativo.
    - pergunta: Sobre o que Matheus Horácio palestra?
      resposta: São três temas. O primeiro é como construir audiência do zero e sem
        verba. O segundo é como sair do operacional através de delegação,
        processo e automação. O terceiro é por que o excesso de informação
        sufoca a criatividade. As palestras duram de 40 a 60 minutos e atendem
        eventos e congressos, lideranças de times criativos, igrejas e empresas.
    - pergunta: Matheus Horácio cobra cachê para palestrar?
      resposta: Não. Matheus Horácio não cobra cachê para palestrar, nem em igrejas,
        ONGs e projetos sem fins lucrativos, nem em empresas e organizações. Em
        qualquer contexto, deslocamento, alimentação e hospedagem ficam por
        conta da organização anfitriã.
    - pergunta: Onde Matheus Horácio já falou?
      resposta: Palestrou sobre comunicação no 12º Seminário de Comunicação Social da
        Arquidiocese do Rio de Janeiro, e no Movimento Encontrão em Curitiba.
        Também já participou de entrevistas e podcasts, entre eles JesusCopy,
        Bacon 161, Santo Café e Gospel Channel Brasil.
    - pergunta: Qual é a experiência profissional de Matheus Horácio?
      resposta: >-
        Com mais de 10 anos de experiência no mercado digital, Matheus Horácio
        tem no The Chosen um dos principais destaques de sua trajetória. Entrou
        no The Chosen Brasil em outubro de 2022 como Social Media Manager,
        quando a equipe era formada por apenas duas pessoas. Em agosto de 2024,
        foi promovido a Content Manager e, em janeiro de 2026, a Creative Lead.


        Ao longo dessa trajetória, criou o calendário editorial e a estrutura de
        conteúdo que seguem sendo utilizados pela equipe até hoje. Também é
        responsável pela criação de filtros para Instagram e Tiktok que, juntos,
        já ultrapassaram 11 milhões de aberturas de forma orgânica, sem
        investimento em mídia, e pela automação de fluxos de trabalho da equipe,
        que devolveu mais de 8 horas mensais para cada integrante.
    - pergunta: Como convidar Matheus Horácio para um evento?
      resposta: Por e-mail, em MatheusHoracio.Contato@gmail.com, informando o evento,
        a data, a cidade e quem é o público. A agenda de 2026 está aberta.
