depoimentos:
  visivel: true
  rotulo: 07 · Quem trabalha comigo
  tema: claro
  itens:
    - texto: Uma das mentes mais criativas e estratégicas que já conheci, mas,
        principalmente, com clareza sobre como transformar isso em resultado.
      autor: David Cavalcante
      cargo: Operations Lead no The Chosen Brasil
    - texto: Sua capacidade de estruturar processos claros, definir fluxos e organizar
        prioridades cria um ambiente mais eficiente, produtivo e sustentável.
      autor: Barbara Cordeli
      cargo: Audiovisual Productions no The Chosen Brasil
    - texto: Não guarda conhecimento para si. Orienta, capacita e incentiva as pessoas
        ao seu redor a pensarem de forma autônoma.
      autor: Fabricia Erler
      cargo: Content Creator e Community Manager no The Chosen Brasil
    - texto: Uma habilidade rara de ver caminhos onde ainda não existe nada, e de
        transformar ideias em algo real, executável e estratégico.
      autor: Rafaela Caro
      cargo: Communication Coordinator no The Chosen Brasil
