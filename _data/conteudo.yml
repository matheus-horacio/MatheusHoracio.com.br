perguntas:
  visivel: true
  rotulo: Perguntas frequentes
  tema: escuro
  itens:
    - pergunta: Quem é Matheus Horácio?
      resposta: Matheus Horácio é comunicador, palestrante e Creative Lead do The Chosen
        Brasil, onde lidera toda a parte criativa. Mora em Londrina, no Paraná, e
        trabalha com conteúdo digital há mais de dez anos. Como fã, criou o maior
        portal brasileiro sobre a série The Chosen, que passou de cem mil seguidores
        sem verba, e foi contratado pela própria série em outubro de 2022.
    - pergunta: O que Matheus Horácio faz no The Chosen Brasil?
      resposta: Lidera a criação do The Chosen Brasil e um time in-house de seis
        pessoas. Conduz as estratégias de social de campanhas como o Natal com The
        Chosen e os lançamentos das temporadas 3, 4 e 5, nos cinemas e depois no
        streaming, e dá direcionamento e suporte ao time da América Latina. As redes
        do The Chosen Brasil foram construídas do zero e, em outubro de 2026, somam
        3,9 milhões de seguidores no Instagram, 2,6 milhões no Facebook, 1,26 milhão
        de inscritos no YouTube, com mais de 217 milhões de visualizações, e quase 1
        milhão no TikTok.
    - pergunta: Sobre o que Matheus Horácio palestra?
      resposta: São quatro temas. Como criar e estruturar conteúdo para as redes
        sociais. Como se constrói audiência, de zero a mais de 8 milhões de
        seguidores. Como montar um time de social que entrega mais, com delegação,
        processo e automação. E como ter impacto e ser visto nas redes sociais. As
        palestras atendem igrejas, ONGs, projetos sociais, empresas e organizações.
    - pergunta: Matheus Horácio cobra cachê para palestrar?
      resposta: Não. Matheus Horácio não cobra cachê, nem em igrejas, ONGs e projetos
        sociais, nem em empresas e organizações. Em qualquer contexto, deslocamento,
        alimentação e hospedagem ficam por conta da organização anfitriã. Como a
        agenda é limitada, cada convite é avaliado de acordo com o evento e o
        público.
    - pergunta: Onde Matheus Horácio já falou?
      resposta: Palestrou no 12º Seminário de Comunicação Social da Arquidiocese do Rio
        de Janeiro e no Movimento Encontrão, em Curitiba. Também participou de
        entrevistas e podcasts, entre eles JesusCopy, Bacon 161, Santo Café e Gospel
        Channel Brasil, e de uma conversa ao vivo com Dallas Jenkins, criador de The
        Chosen.
    - pergunta: Qual é a experiência profissional de Matheus Horácio?
      resposta: >-
        Com mais de dez anos no digital, começou em 2016 com um canal no YouTube de
        vídeos legendados e dublados, com dublagens que passaram de 1 milhão de
        visualizações. Passou pelos cursos de Administração, Engenharia Elétrica e
        Publicidade e Propaganda.


        Entrou no The Chosen Brasil em outubro de 2022 como Social Media Manager,
        quando a equipe tinha duas pessoas. Foi promovido a Content Manager em agosto
        de 2024 e a Creative Lead em janeiro de 2026. Criou o calendário editorial e a
        estrutura de conteúdo usados até hoje, um filtro que passou de 11 milhões de
        aberturas no Instagram sem mídia paga, e ferramentas e automações com
        inteligência artificial que devolveram mais de 8 horas por mês a cada pessoa
        do time.
    - pergunta: Como convidar Matheus Horácio para um evento?
      resposta: Pelo e-mail eu@matheushoracio.com.br, informando o evento, a data, a
        cidade, o público e o que as pessoas devem levar embora. O site também tem um
        formulário que monta o convite pronto. A agenda de 2026 está aberta.
