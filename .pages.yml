# Configuração do Pages CMS — app.pagescms.org
# Conecte este repositório e tudo abaixo vira formulário visual.

media:
  input: assets/img
  output: /assets/img
  extensions: [webp, jpg, jpeg, png, avif]
  categories: [image]

content:
  - name: conteudo
    label: Site
    path: _data/conteudo.yml
    type: file
    icon: file-text
    fields:

      # O texto da história fica no código (index.html). Aqui ficam só o que o Google
      # e as IAs leem: título, descrição e perguntas frequentes.

      - name: seo
        label: 🔍 Google e redes sociais
        type: object
        fields:
          - name: titulo
            label: Título da página
            type: string
            description: "Aparece na aba do navegador e no Google. Até 60 caracteres funciona melhor."
          - name: descricao
            label: Descrição
            type: text
            description: "O parágrafo que o Google mostra abaixo do título. Até 160 caracteres."
          - name: imagem
            label: Imagem de compartilhamento
            type: image
            description: "📐 EXATAMENTE 1200 × 630 px (proporção 1,91:1), até 300 KB, JPG. Aparece quando alguém manda o link no WhatsApp, LinkedIn ou Facebook. Deixe o rosto no centro: as bordas são cortadas em algumas redes."
          - name: favicon
            label: Favicon
            type: image
            description: "ENVIE 512 x 512 px, PNG com fundo transparente, ate 50 KB. E o icone que aparece na aba do navegador, nos favoritos e no atalho da tela inicial do celular. Precisa ser QUADRADO e legivel bem pequeno: use so a inicial ou um simbolo, nunca o nome inteiro. O atual tem 96 x 96, que fica embacado em tela de alta resolucao."
          - name: analytics
            label: ID do Google Analytics
            type: string
          - name: wikidata
            label: Link do Wikidata
            type: string

      - name: perguntas
        label: 8️⃣ Dúvidas frequentes
        type: object
        description: "É a seção que o Google e o ChatGPT mais usam para citar você. Vale caprichar."
        fields:
          - { name: visivel, label: Mostrar esta seção, type: boolean, default: true }
          - { name: rotulo, label: Rótulo, type: string }
          - name: tema
            label: Fundo
            type: select
            options:
              values:
                - { value: claro, label: Claro }
                - { value: escuro, label: Escuro }
          - name: itens
            label: Perguntas
            type: object
            list: true
            fields:
              - { name: pergunta, label: Pergunta, type: string, description: "Escreva como alguém digitaria no Google." }
              - { name: resposta, label: Resposta, type: text, description: "Frases completas, começando por 'Matheus Horácio...'. Uma IA copia isto literalmente." }

